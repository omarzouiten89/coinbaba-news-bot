# Runs the COINBABA news bot every 10 minutes on GitHub (free), without any computer switched on.
name: COINBABA news bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write   # only used by the keep-alive step below
  actions: write    # lets the run save its memory (cache)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      # Hybrid mode: if the Mac bot said "I'm alive" less than 15 minutes ago, GitHub does nothing.
      - name: Is the Mac bot running?
        id: mac
        run: |
          if git fetch --quiet --depth=1 origin heartbeat 2>/dev/null; then
            age=$(( $(date +%s) - $(git log -1 --format=%ct FETCH_HEAD) ))
            echo "Last Mac heartbeat: ${age}s ago"
            if [ "$age" -lt 900 ]; then echo "alive=true" >> "$GITHUB_OUTPUT"; echo "Mac is running: skipping this run."; fi
          else
            echo "No Mac heartbeat found"
          fi

      - uses: actions/setup-python@v5
        if: steps.mac.outputs.alive != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.mac.outputs.alive != 'true'

      - name: Arabic font for the lesson card
        if: steps.mac.outputs.alive != 'true'
        run: sudo apt-get install -y -qq fonts-noto-core fonts-dejavu-core >/dev/null

      # The bot's memory (what it already saw / published) is kept between runs.
      - name: Restore memory
        if: steps.mac.outputs.alive != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/bot.db
          key: bot-db-${{ github.run_id }}
          restore-keys: bot-db-

      - name: Check sources and publish
        if: steps.mac.outputs.alive != 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_MODEL: gemini-flash-latest,gemini-3.5-flash,gemini-flash-lite-latest,gemini-3.5-flash-lite
          DRY_RUN: "0"
        run: python run.py once

      - name: Save memory
        if: always() && steps.mac.outputs.alive != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/bot.db
          key: bot-db-${{ github.run_id }}

      # GitHub pauses scheduled jobs in repositories with no activity for 60 days.
      # This makes a tiny commit every ~40 days so the bot never stops.
      - name: Keep alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "coinbaba-bot"
            git config user.email "coinbaba-bot@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "keep alive"
            git push
          fi
