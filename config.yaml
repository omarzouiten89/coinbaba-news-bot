# ===== إعدادات بوت COINBABA (ماشي سرية) =====

# القناة اللي غادي ينشر فيها البوت.
# في البداية: القناة التجريبية. باش تعرف الرقم ديالها شغّل:  python3 run.py find-channel
# مثال: -1001234567890
target_channel: "-1003886652808"   # Finance Man بالعربي (@financemante)
# القناة التجريبية COINBABA Test: -1004409432582
# اسم القناة العام: البوت كيقرا آخر المنشورات ديالها باش ما يعاودش خبر تنشر (Mac + GitHub)
target_channel_public: "financemante"

# القنوات اللي كنراقبو (خاصهم يكونو قنوات عامة). البوت كيقراهم من الصفحة العامة t.me/s
# بلا حساب Telegram. اكتب @اسم_القناة أو الرابط https://t.me/...
telegram_channels:
  - "@WatcherGuru"
  - "@knowMoreCrypt00"
  - "@CoinDeskGlobal"
  # --- قنوات التحليل (كتترجم للعربية، والشارت كيتنشر معاها) ---
  - name: "@glassnode"
    kind: analysis
    daily_max: 3
  - name: "@cryptoquant_official"
    kind: analysis
    daily_max: 2

# المواقع الإخبارية (RSS)
rss_feeds:
  - name: Cointelegraph
    url: https://cointelegraph.com/rss
    daily_max: 1          # غير خبر واحد فالنهار
    min_importance: 8     # وخاصو يكون مهم بزاف (من 10)
  - name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
  - name: FXStreet Gold
    url: https://www.fxstreet.com/rss/analysis
    kind: analysis
    daily_max: 2
    keywords: ["gold", "xau"]   # غير تحليلات الذهب

# أقصى عدد ديال الأخبار فالنهار (التحليلات والمعلومات والاستطلاعات عندهم الحد ديالهم)
daily_limit: 20

# الأخبار خاصها تكون مهمة: نقطة من 10 (6 = فوق العادي). Cointelegraph عندو 8.
news_min_importance: 6

# الأخبار العادية والتحليلات كتوصل بلا صوت. الصوت غير للعاجل والمعلومة والاستطلاع.
silent_news: true

# ساعات الهدوء: ما كينشر غير الأخبار العاجلة الكبيرة. التحليلات كتتسنى للصباح.
quiet_hours:
  start: "00:00"
  end: "07:00"
timezone: Asia/Dubai

# كل شحال من ثانية كيشوف المواقع (180 = 3 دقائق)
rss_interval_seconds: 180

# كل شحال من ثانية كيشوف قنوات Telegram (60 = دقيقة)
channel_check_seconds: 60

# الأخبار اللي فاتها هاد العدد ديال الساعات ما كتنشرش
max_item_age_hours: 6

# أقل وقت بين طلبين للذكاء الاصطناعي (باش نبقاو في الحد المجاني)
llm_min_interval_seconds: 7

# ===== 📘 النشر في صفحة فيسبوك COINBABA (نفس منشورات Telegram، بلا روابط، مع هاشتاغات) =====
# المفاتيح (FB_PAGE_ID و FB_PAGE_TOKEN) كيتحطو فـ .env وفـ GitHub Secrets، ماشي هنا.
facebook:
  enabled: true
  daily_max: 5                # البداية: 5 فالنهار لمدة أسبوعين، من بعد 8 حتى 10 (كيتحسب من الصفحة نفسها)
  min_gap_minutes: 60         # أقل وقت بين خبرين (الملخص والمعلومات ما كيتسناوش)
  graph_version: v27.0
  stories: true               # كل منشور فيه صورة كيتزاد حتى فـ Story ديال الصفحة (نفس الصورة)
  news_min_importance: 7      # غير الأخبار المهمة (من 10). Telegram كينشر من 6
  kinds: [news, analysis, lesson, morning]   # الاستطلاعات وأفكار التداول ما كيتنشروش فـ فيسبوك
  max_hashtags: 5

# ===== ☀️ ملخص الصباح: الأسعار + أهم الأخبار + أحداث اليوم =====
morning_brief:
  enabled: true
  time: "08:00"   # بتوقيت الإمارات

# ===== 3 معلومات تعليمية فالنهار (بطاقة COINBABA بالصورة ديالك) =====
daily_lessons:
  enabled: true
  times: ["10:00", "15:00", "21:00"]   # بتوقيت الإمارات

# ===== استطلاع رأي يومي (البيتكوين، الذهب، حدث اقتصادي، اتجاه السوق: كيتبدلو كل نهار) =====
daily_polls:
  enabled: true
  times: ["13:00", "19:00"]   # بتوقيت الإمارات

# ===== نقل منشورات قناة إلى قناة (HashNet) =====
mirrors:
  - source: "@HashnetArab"          # القناة اللي كناخذو منها
    target: "@cryptoomentor"        # القناة ديالك (HashNet Arab)
    keep_link_domains: ["zoom.us"]  # الروابط اللي كتبقى. أي رابط آخر كيتحيد
    footer: "👈 سجّل الآن من هنا:"
    link: "https://app.hashnet.ai/Onemillion"   # رابط التسجيل ديالك
    start_after_id: 259             # نبداو من المنشور 260 (بداية منتج التأجير Lease)
    inquiry_label: "💬 للاستفسار تواصل مع المساعد"
    inquiry_link: "https://t.me/CoinBabaOfficialBot?start=hashnet"   # البوت اللي كيجاوب الناس

  - source: "@Hashnet11"            # HashNet مشروع العمر
    target: "@cryptoomentor"
    only: audio                     # غير المنشورات اللي فيها أوديو / رسالة صوتية
    keep_link_domains: ["zoom.us"]
    footer: "👈 سجّل الآن من هنا"
    link: "https://app.hashnet.ai/Onemillion"
    inquiry_label: "💬 للاستفسار تواصل مع المساعد"
    inquiry_link: "https://t.me/CoinBabaOfficialBot?start=hashnet"

# ===== الإعلان اليومي ديال الدورات (مرة فالنهار، بأزرار كتدي للموقع) =====
daily_promo:
  enabled: false          # كيولي true ملي نحطو الروابط
  time: "20:00"           # الساعة بتوقيت الإمارات
  image_url: ""           # (اختياري) رابط صورة الإعلان
  text: |
    🎓 تعلّم الاستثمار مع COINBABA

    دورات عملية تشرح لك أسواق الكريبتو والذهب والأسهم الأمريكية خطوة بخطوة، من الصفر حتى الاحتراف.

    👇 اكتشف الدورات من الأزرار أسفله
  buttons:
    - text: "🎓 الدورات"
      url: ""
    - text: "🌐 الموقع الرسمي"
      url: ""

# ===== 💡 أفكار تداولية على الأسهم الأمريكية (للتعلّم على الحساب التجريبي) =====
# كل الأرقام محسوبة من الشموع الحقيقية (Yahoo)، والبوت كيرد على كل فكرة بالنتيجة ديالها.
trade_ideas:
  enabled: true
  channel: "-1005998542468"   # الاسهم الامريكية vip
  handle: ""                   # مثال: "@financeman_stocks"
  times: ["18:45", "20:30"]    # بتوقيت الإمارات (السوق الأمريكي كيحل 18:30 فالشتا)
  per_slot: 1                  # فكرة وحدة فكل وقت
  long_only: true               # شراء مباشر فقط: بلا رافعة، بلا Short، بلا عقود آجلة
  tickers: [NVDA, MSFT, AAPL, AMZN, GOOGL, META, TSLA, AMD, NFLX, PLTR,
            CNDX.L, CSPX.L, IUIT.L, SMH.L]   # صناديق ETF كيفما كاينين فـ XTB (CNDX.UK, CSPX.UK...)
